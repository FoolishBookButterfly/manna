<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Manna: {% block title %}{% endblock %}</title>
            <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
            <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
        </head>
        
        <body>
            <header class="site-header">
                <div class="shell">
                <a class="brand" href="/">
                    <svg class="brand-mark" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                    <path d="M10 18V6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                    <ellipse cx="10" cy="4.4" rx="2.1" ry="3" fill="currentColor"/>
                    <ellipse cx="6.6" cy="8.2" rx="1.9" ry="2.7" fill="currentColor" opacity=".8"/>
                    <ellipse cx="13.4" cy="8.2" rx="1.9" ry="2.7" fill="currentColor" opacity=".8"/>
                    <ellipse cx="6.9" cy="12.6" rx="1.7" ry="2.4" fill="currentColor" opacity=".6"/>
                    <ellipse cx="13.1" cy="12.6" rx="1.7" ry="2.4" fill="currentColor" opacity=".6"/>
                    </svg>
                    Manna
                </a>
                <nav class="nav" aria-label="Main">
                    <a href="/book" aria-current="page">Books</a>
                    <a href="/search">Search</a>
                    <a href="/notes">My Notes</a>
                    <a href="/login">Log in</a>
                <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode" title="Switch to dark mode">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                </button>
                </nav>
                </div>
            </header>
            <main>
                {% block main %}{% endblock %}
            </main>

            <footer class="site-footer">
                <div class="shell row">
                <span>Manna</span>
                <span>A simple place to receive His daily bread</span>
                <span class="spacer">King James Version · Public Domain © 2026 Manna</span>
                </div>
            </footer>
        
        </body>

    </html>
